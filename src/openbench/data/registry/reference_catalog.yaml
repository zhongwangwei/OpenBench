      prefix: SMAP_L4_sm_surface_
      suffix: ''
    Root_Zone_Soil_Moisture:
      varname: sm_rootzone
      varunit: m3 m-3
      sub_dir: Water/Root_Zone_Soil_Moisture/SMAP_L4_Soil
      prefix: SMAP_L4_sm_rootzone_
      suffix: ''
    Surface_Soil_Temperature:
      varname: soil_temp_layer1
      varunit: K
      sub_dir: Meteo/Surface_Soil_Temperature/SMAP_L4_Soil
      prefix: SMAP_L4_soil_temp_layer1_
      suffix: ''
    Root_Zone_Soil_Temperature:
