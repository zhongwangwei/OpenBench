SMAP_L4_Soil_LowRes:
  name: SMAP_L4_Soil_LowRes
  description: >-
    SMAP L4 soil products processed from provided 0.1-degree daily fields.
    Root-zone temperature is a user-approved nominal 0–1 m derived estimate,
    with p=0 and layerwise-uniform temperatures, weighted 0.0988, 0.1952,
    0.3859, 0.3201 from soil_temp_layer1 through soil_temp_layer4;
    it is not a native NASA field. Root-zone moisture only on 2016-06-13
    is globally missing due to source corruption (date retained, no interpolation);
    the monthly mean uses remaining valid days. Temperature is unaffected.
  category: Water
  data_type: grid
  tim_res: Month
  data_groupby: Year
  timezone: 0
  root_dir: ${OPENBENCH_REF_ROOT}/Grid/LowRes
