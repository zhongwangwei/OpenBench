    layout: station_shared_files
    root_sub_dir: Station/Water/StreamFlow/Monthly
    file_glob: BRSC_monthly.nc
  description: Bureau of River System Compilation monthly streamflow
  tim_res: Month
  data_groupby: single
  station_matching:
    method: cama_allocation
    dataset_file: BRSC_monthly.nc
    station_id_var: station
