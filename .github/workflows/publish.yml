name: Publish to PyPI

# Manual-only: publishing to PyPI is done manually (twine upload) for now,
# so a GitHub Release no longer auto-triggers (and fails) this workflow.
# Run it from the Actions tab when trusted publishing is configured.
on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build pytest
      - run: python -m build
      - name: Verify built artifacts
        env:
          OPENBENCH_DIST_DIR: dist
        run: python -m pytest tests/test_build_artifacts.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-test-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: test-pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
