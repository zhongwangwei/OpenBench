{% set name = "colm-openbench" %}
{% set dist_name = name|replace("-", "_") %}
{% set version = "3.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/zhongwangwei/OpenBench/releases/download/v{{ version }}/{{ dist_name }}-{{ version }}.tar.gz
  sha256: c64c9c33d4ed0a941202c35b88ebca9ba6e8e256409cbbcb15ce5d1c1cf652e1

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - openbench = openbench.cli.main:cli

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling >=1.27.0
  run:
    - python >=3.10
    - xarray >=0.19.0
    - numpy >=1.21.0
    - scipy >=1.7.0
    - pandas >=1.3.0
    - netcdf4 >=1.5.7
    - matplotlib-base >=3.4.0
    - cartopy >=0.20.0
    - dask >=2022.1.0
    - distributed >=2022.1.0
    - joblib >=1.1.0
    - flox >=0.5.0
    - pyyaml >=6.0
    - jinja2 >=3.0.0
    - click >=8.0
    - tqdm >=4.0
    - packaging >=21.0
    # Analysis / plotting / migration features (part of the default install).
    # PDF reports (xhtml2pdf) stay optional — see optional-dependencies in pyproject.
    - scikit-learn >=1.0
    - statsmodels >=0.13
    - seaborn >=0.12
    - f90nml >=1.4.4

test:
  requires:
    - pip
  imports:
    - openbench
    - openbench.config
    - openbench.data.registry
  commands:
    - python -m pip check
    - openbench --version
    - openbench model list
    - openbench smoke-test

about:
  home: https://github.com/CoLM-SYSU/OpenBench
  dev_url: https://github.com/zhongwangwei/OpenBench
  license: MIT AND GPL-3.0-only AND LicenseRef-NCL-6.3.0
  license_file:
    - LICENSE
    - src/openbench/visualization/cmaps/LICENSE
    - src/openbench/visualization/cmaps/colormaps/ncar_ncl/Copyright
    - src/openbench/visualization/cmaps/colormaps/ncar_ncl/NCL_source_license.txt
  summary: Open Source Land Surface Model Benchmarking System
  description: |
    OpenBench is a fully automated, cross-platform framework for
    benchmarking land surface models (LSMs) against curated reference
    datasets with consistent metrics, visualizations, and reports.

extra:
  recipe-maintainers:
    - zhongwangwei
